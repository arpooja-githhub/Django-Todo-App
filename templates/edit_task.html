<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit task-Django TODO App</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="icon" href="favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
  <div class="container">
    <h3 class="pt-5 pb-5 task-center">Django TODO App - Edit task</h3>
    <form action="{% url 'edit_task' get_task.pk  %}" method="POST" style="width:500px; margin:auto;">
                <!-- Cross Site Request Forgery --> 
                {% csrf_token %}
                <div class="form-group d-flex">
                    <input type="text" name="task" class="form-control" placeholder="Add a task" value="{{ get_task.task }}">
                    <button type="submit" class="btn btn-primary" style="width: 200px;">
                        <i class=""></i> Update
                    </button>
                </div>
            </form>
  </div>
</body>
</html>
