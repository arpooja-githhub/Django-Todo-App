<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>


<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<style>
    body {
        background-color: #f5f7fa;
    }
    .container {
        margin-top: 30px;
    }
    .form-control {
        padding: 1.2rem;
    }
    .task-box {
        height: 450px;
        overflow-y: scroll;
    }
    .card {
        border-radius: 10px;
    }
    .btn {
        margin-left: 5px;
    }
    .add-form {
        position: fixed;
        bottom: 20px;
        width: 50%;
    }
</style>


</head>

<body>
    <div class="container">
        <h3 class="text-center mb-4">Django ToDo App</h3>


    <div class="row">
        <h4>My Day</h4>
        <p class="text-muted">{% now "jS F Y" %}</p>

        <!-- Pending Tasks -->
        <div class="col-md-7 task-box">
            <!--List of tasks of the day -->
            {% for task in tasks %}
            <div class="card m-2">
                <div class="card-body">
                    {{ task.task }} 
                    <span style="float:right;">
                        <a href="{% url 'mark_as_done' task.pk %}" class="btn btn-success"><i class="fa fa-check"> </i>  Mark as done</a>
                        <a href="{% url 'delete_task' task.id %}" class="btn btn-danger"><i class="fa fa-trash"></i></a>
                        <a href="{% url 'edit_task' task.id %}" class="btn btn-primary"><i class="fa fa-pencil"></i></a>
                    </span>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Completed Tasks -->
        <div class="col-md-5">
            <h5>Completed Tasks</h5>
            {% for task in completed_tasks %}
            <div class="card m-2">
                <div class="card-body">
                    {{ task.task }} 
                    <span style="float:right;">
                        <a href="{% url 'mark_as_undone' task.pk %}" class="btn btn-warning"><i class="fa fa-times"></i></a>
                    </span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Add Task Form -->
    <div class="row">
        <div class="col-md-6 add-form">
            <form action="{% url 'addTask' %}" method="POST">
                <!-- Cross Site Request Forgery --> 
                {% csrf_token %}
                <div class="form-group d-flex">
                    <input type="text" name="task" class="form-control" placeholder="Add a task">
                    <button type="submit" class="btn btn-primary" style="width: 200px;">
                        <i class="fa fa-plus"></i> Add
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


</body>
</html>
